<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Jabakhanji Store - PS4 Jailbreak</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        /* خلفية متدرجة أمان لعدم ضرب الكاش أوفلاين + دعم الصورة */
        background: #0b0d10 radial-gradient(circle at center, #1a2332 0%, #0b0d10 100%) no-repeat center center fixed;
        background-image: url('bg.jpg'), radial-gradient(circle at center, #1a2332 0%, #0b0d10 100%);
        background-size: cover;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #brand {
        text-align: center;
        padding: 10px;
        background: rgba(14, 17, 22, 0.9);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      #brand img {
        width: 32px;
        height: 32px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
        object-fit: cover;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
        background: rgba(14, 17, 22, 0.85);
        padding: 15px;
        margin: 0 auto;
        max-width: 300px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
        max-width: 800px;
        margin: 0 auto;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: rgba(17, 21, 27, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 10px 12px;
        height: calc(100vh - 180px);
        overflow-y: auto;
        backdrop-filter: blur(5px);
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
      #contact {
        position: fixed;
        bottom: 12px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
        color: #7fd0a0;
      }
      #contact span {
        background: rgba(14, 17, 22, 0.85);
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <img src="icon0.png" alt="Jabakhanji Store" />
      <b>JABAKHANJI STORE</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <div id="contact">
      <span><b>Jabakhanji Store</b> | WhatsApp: <b>71 358 141</b></span>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
